<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLATELINE</title>
<meta name="theme-color" content="#15161A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plateline">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#15161A;
  --surface:#1D1F24;
  --surface2:#262931;
  --line:#33363E;
  --text:#EDEBE6;
  --text-dim:#8B8F98;
  --accent:#C4432B;
  --accent-dim:#7A2E1F;
  --good:#7C9A6E;
  --good-dim:#3E4E38;
  --blue:#5C86AD;
  --blue-dim:#2E4356;
  --font-display:'Oswald',sans-serif;
  --font-body:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  padding:0 0 4rem;
}
.wrap{max-width:640px;margin:0 auto;padding:1.25rem 1rem 0;}
.app-title{
  font-family:var(--font-display);
  font-weight:700;
  font-size:1.6rem;
  letter-spacing:0.04em;
  text-transform:uppercase;
  color:var(--text);
}
.app-title span{color:var(--accent);}
.app-sub{color:var(--text-dim);font-size:0.8rem;margin-top:0.15rem;letter-spacing:0.03em;}

.tabs{display:flex;gap:0.3rem;margin:1.25rem 0 1rem;border-bottom:1px solid var(--line);overflow-x:auto;}
.tab-btn{
  font-family:var(--font-display);
  background:none;border:none;color:var(--text-dim);
  font-size:0.8rem;letter-spacing:0.05em;text-transform:uppercase;
  padding:0.6rem 0.7rem;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;
}
.tab-btn.active{color:var(--text);border-bottom-color:var(--accent);}

.day-row{display:flex;gap:0.4rem;overflow-x:auto;padding-bottom:0.2rem;}
.day-pill{
  font-family:var(--font-display);
  background:var(--surface);border:1px solid var(--line);color:var(--text-dim);
  padding:0.5rem 0.8rem;border-radius:3px;font-size:0.76rem;letter-spacing:0.05em;
  text-transform:uppercase;cursor:pointer;white-space:nowrap;flex-shrink:0;
}
.day-pill.active{background:var(--accent-dim);border-color:var(--accent);color:var(--text);}
.day-pill.test-day{border-style:dashed;}

.phase-tag{display:inline-block;font-family:var(--font-display);font-size:0.68rem;letter-spacing:0.05em;text-transform:uppercase;color:var(--text-dim);background:var(--surface2);padding:0.2rem 0.55rem;border-radius:3px;margin-bottom:0.6rem;}

.session-head{margin:1.1rem 0 0.6rem;}
.session-head .kind{color:var(--accent);font-family:var(--font-display);font-size:0.75rem;letter-spacing:0.08em;text-transform:uppercase;}
.session-head h2{font-family:var(--font-display);font-size:1.3rem;text-transform:uppercase;letter-spacing:0.02em;margin-top:0.15rem;}

.cardio-card{background:var(--blue-dim);border:1px solid var(--blue);border-radius:6px;padding:0.75rem 1rem;margin-bottom:0.9rem;display:flex;justify-content:space-between;align-items:center;gap:0.6rem;}
.cardio-left .cardio-type{font-family:var(--font-display);font-size:0.68rem;letter-spacing:0.05em;text-transform:uppercase;color:var(--blue);}
.cardio-left .cardio-desc{font-size:0.82rem;margin-top:0.15rem;color:var(--text);}
.cardio-check{
  width:1.8rem;height:1.8rem;border-radius:4px;border:1px solid var(--blue);background:var(--surface2);
  color:var(--blue);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.cardio-check.done{background:var(--good-dim);border-color:var(--good);color:var(--good);}

.ex-card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0.9rem 1rem;margin-bottom:0.7rem;}
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:0.6rem;}
.ex-name{font-weight:600;font-size:0.95rem;}
.ex-target{color:var(--text-dim);font-size:0.78rem;margin-top:0.1rem;}
.ex-status{font-size:0.68rem;font-family:var(--font-display);letter-spacing:0.05em;text-transform:uppercase;padding:0.2rem 0.5rem;border-radius:3px;white-space:nowrap;}
.status-pace{background:var(--good-dim);color:var(--good);}
.status-build{background:var(--surface2);color:var(--text-dim);}

.weight-row{display:flex;align-items:baseline;gap:0.5rem;margin:0.6rem 0 0.3rem;}
.weight-val{font-family:var(--font-display);font-size:1.6rem;font-weight:600;}
.weight-unit{color:var(--text-dim);font-size:0.75rem;}
.weight-bump{color:var(--good);font-size:0.72rem;font-family:var(--font-display);letter-spacing:0.03em;}

.plate-bar{display:flex;align-items:flex-end;gap:2px;height:34px;margin:0.4rem 0 0.7rem;}
.plate{background:var(--accent);border-radius:2px 2px 0 0;}
.bar-line{flex:1;height:4px;background:var(--line);align-self:center;min-width:10px;}

.sets-grid{display:flex;flex-direction:column;gap:0.35rem;margin-top:0.5rem;}
.set-line{display:flex;align-items:center;gap:0.5rem;}
.set-idx{width:1.4rem;color:var(--text-dim);font-size:0.78rem;font-family:var(--font-display);}
.set-line input{
  background:var(--surface2);border:1px solid var(--line);color:var(--text);
  border-radius:4px;padding:0.4rem 0.5rem;font-size:0.85rem;width:4.4rem;font-family:var(--font-body);
}
.set-line input:focus{outline:none;border-color:var(--accent);}
.set-lbl{color:var(--text-dim);font-size:0.72rem;}
.set-check{
  margin-left:auto;width:1.6rem;height:1.6rem;border-radius:4px;border:1px solid var(--line);
  background:var(--surface2);color:var(--text-dim);cursor:pointer;font-size:0.9rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.set-check.done{background:var(--good-dim);border-color:var(--good);color:var(--good);}

.prev-line{color:var(--text-dim);font-size:0.72rem;margin-top:0.5rem;padding-top:0.5rem;border-top:1px solid var(--line);}

.save-btn{
  width:100%;background:var(--accent);color:#FBEAE5;border:none;border-radius:6px;
  font-family:var(--font-display);font-size:0.85rem;letter-spacing:0.05em;text-transform:uppercase;
  padding:0.8rem;margin-top:0.8rem;cursor:pointer;
}
.save-btn:active{opacity:0.85;}
.save-btn:disabled{opacity:0.4;}
.ghost-btn{
  width:100%;background:none;color:var(--text-dim);border:1px solid var(--line);border-radius:6px;
  font-family:var(--font-display);font-size:0.78rem;letter-spacing:0.05em;text-transform:uppercase;
  padding:0.6rem;margin-top:0.5rem;cursor:pointer;
}

.hist-item{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0.8rem 1rem;margin-bottom:0.6rem;cursor:pointer;}
.hist-head{display:flex;justify-content:space-between;align-items:center;}
.hist-date{font-family:var(--font-display);font-size:0.95rem;}
.hist-day{color:var(--text-dim);font-size:0.75rem;}
.hist-detail{margin-top:0.6rem;padding-top:0.6rem;border-top:1px solid var(--line);font-size:0.8rem;color:var(--text-dim);display:none;}
.hist-detail.open{display:block;}
.hist-detail .hd-line{display:flex;justify-content:space-between;padding:0.15rem 0;}
.empty-note{color:var(--text-dim);font-size:0.85rem;padding:1.5rem 0;text-align:center;}

.photo-row{display:flex;align-items:center;gap:0.6rem;margin-bottom:0.8rem;}
.photo-label{
  flex:1;background:var(--surface2);border:1px dashed var(--line);border-radius:6px;
  padding:0.7rem;text-align:center;cursor:pointer;font-size:0.82rem;color:var(--text-dim);
  font-family:var(--font-display);letter-spacing:0.03em;text-transform:uppercase;
}
.photo-label:hover{border-color:var(--accent);color:var(--text);}
.photo-status{font-size:0.78rem;color:var(--text-dim);margin:-0.3rem 0 0.7rem;min-height:1rem;}
.photo-status.error{color:var(--accent);}
.food-item{display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border-radius:4px;padding:0.5rem 0.7rem;margin-bottom:0.4rem;font-size:0.8rem;}
.food-item .fi-desc{flex:1;}
.food-item .fi-macros{color:var(--text-dim);margin:0 0.6rem;white-space:nowrap;}
.food-item .fi-remove{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:1rem;}
.food-item .fi-remove:hover{color:var(--accent);}

.body-form{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1rem;margin-bottom:1rem;}
.form-row{display:flex;flex-direction:column;gap:0.3rem;margin-bottom:0.7rem;}
.form-row label{font-size:0.72rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.04em;font-family:var(--font-display);}
.form-row input{
  background:var(--surface2);border:1px solid var(--line);color:var(--text);
  border-radius:4px;padding:0.55rem 0.6rem;font-size:0.9rem;font-family:var(--font-body);
}
.form-row input:focus{outline:none;border-color:var(--accent);}
.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.6rem;}

.metric-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem;margin-bottom:1rem;}
.metric-card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0.7rem 0.8rem;}
.metric-lbl{font-size:0.68rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.04em;font-family:var(--font-display);}
.metric-val{font-family:var(--font-display);font-size:1.3rem;margin-top:0.15rem;}
.metric-delta{font-size:0.72rem;margin-top:0.1rem;}
.delta-down{color:var(--good);}
.delta-up{color:var(--accent);}

.chart-wrap{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0.9rem;margin-bottom:1rem;}
.chart-title{font-family:var(--font-display);font-size:0.78rem;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-dim);margin-bottom:0.5rem;}

.body-log-row{display:flex;justify-content:space-between;padding:0.5rem 0;border-bottom:1px solid var(--line);font-size:0.82rem;gap:0.6rem;}
.body-log-row:last-child{border-bottom:none;}
.blr-date{color:var(--text-dim);}

.phase-card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1rem;margin-bottom:0.8rem;}
.phase-card.active{border-color:var(--accent);}
.phase-top{display:flex;justify-content:space-between;align-items:flex-start;}
.phase-name{font-family:var(--font-display);font-size:1.1rem;text-transform:uppercase;letter-spacing:0.02em;}
.phase-weeks{color:var(--text-dim);font-size:0.75rem;margin-top:0.1rem;}
.phase-badge{font-size:0.66rem;font-family:var(--font-display);letter-spacing:0.05em;text-transform:uppercase;padding:0.2rem 0.5rem;border-radius:3px;background:var(--good-dim);color:var(--good);white-space:nowrap;}
.phase-focus{font-size:0.85rem;color:var(--text-dim);margin-top:0.6rem;line-height:1.5;}
.phase-days{margin-top:0.7rem;display:flex;flex-direction:column;gap:0.3rem;}
.phase-day-detail{border-top:1px solid var(--line);padding:0.4rem 0;font-size:0.78rem;}
.phase-day-detail .pd-head{display:flex;justify-content:space-between;color:var(--text-dim);font-family:var(--font-display);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:0.25rem;}
.phase-day-detail .pd-exlist{color:var(--text-dim);line-height:1.5;}

.chipper-card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1rem;margin-bottom:0.8rem;}
.chipper-label{font-family:var(--font-display);font-size:0.72rem;letter-spacing:0.05em;text-transform:uppercase;color:var(--accent);}
.chipper-target{color:var(--text-dim);font-size:0.78rem;margin-top:0.15rem;}
.chipper-movements{margin-top:0.7rem;display:flex;flex-direction:column;gap:0.4rem;}
.chipper-move{display:flex;justify-content:space-between;font-size:0.85rem;padding:0.35rem 0;border-bottom:1px solid var(--line);}
.chipper-move:last-child{border-bottom:none;}
.chipper-move .cm-reps{color:var(--text-dim);font-family:var(--font-display);}
.chipper-inputs{display:flex;gap:0.6rem;margin-top:0.9rem;align-items:flex-end;}
.chipper-time-group{display:flex;gap:0.4rem;align-items:center;}
.chipper-time-group input{
  background:var(--surface2);border:1px solid var(--line);color:var(--text);
  border-radius:4px;padding:0.5rem;font-size:0.9rem;width:3.6rem;text-align:center;font-family:var(--font-display);
}
.chipper-time-group span{color:var(--text-dim);font-size:0.85rem;}
.chipper-best{margin-top:0.8rem;padding-top:0.7rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:0.8rem;color:var(--text-dim);}
.chipper-pr{color:var(--good);font-family:var(--font-display);letter-spacing:0.03em;}

.flow-summary{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1rem;margin-bottom:0.9rem;}
.flow-meta{color:var(--text-dim);font-size:0.8rem;margin-bottom:0.7rem;}
.flow-move-list{display:flex;flex-direction:column;gap:0.4rem;}
.flow-move-row{display:flex;justify-content:space-between;font-size:0.85rem;padding:0.35rem 0;border-bottom:1px solid var(--line);}
.flow-move-row:last-child{border-bottom:none;}
.flow-move-row .fm-best{color:var(--text-dim);font-family:var(--font-display);font-size:0.75rem;}
.flow-stage{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1.4rem 1.2rem;text-align:center;margin-bottom:0.9rem;}
.flow-stage.work{border-color:var(--accent);}
.flow-stage.rest{border-color:var(--good);}
.flow-progress{color:var(--text-dim);font-size:0.72rem;font-family:var(--font-display);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:0.5rem;}
.flow-move-name{font-family:var(--font-display);font-size:1.35rem;text-transform:uppercase;letter-spacing:0.02em;margin-bottom:0.3rem;}
.flow-cue{color:var(--text-dim);font-size:0.82rem;margin-bottom:1rem;min-height:2.2em;}
.flow-timer{font-family:var(--font-display);font-size:3rem;font-weight:700;line-height:1;}
.flow-stage.work .flow-timer{color:var(--accent);}
.flow-stage.rest .flow-timer{color:var(--good);}
.flow-rest-label{font-family:var(--font-display);font-size:0.85rem;letter-spacing:0.05em;text-transform:uppercase;color:var(--good);margin-top:0.4rem;}
.flow-rep-controls{display:flex;align-items:center;justify-content:center;gap:1rem;margin-top:1rem;}
.flow-rep-btn{
  width:3.2rem;height:3.2rem;border-radius:50%;border:1px solid var(--accent);background:var(--accent-dim);
  color:var(--text);font-family:var(--font-display);font-size:1.4rem;cursor:pointer;
}
.flow-rep-count{font-family:var(--font-display);font-size:1.8rem;min-width:3rem;}
.flow-done-summary{margin-top:0.6rem;}
.flow-pr-tag{color:var(--good);font-family:var(--font-display);font-size:0.7rem;letter-spacing:0.03em;margin-left:0.4rem;}

.block-card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:6px;padding:0.7rem 1rem;margin-bottom:0.7rem;}
.block-head{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--font-display);font-size:0.72rem;letter-spacing:0.05em;text-transform:uppercase;color:var(--blue);}
.block-head .bm{color:var(--text-dim);}
.block-items{margin-top:0.4rem;font-size:0.82rem;color:var(--text);line-height:1.55;list-style:none;}
.block-items li{padding:0.1rem 0;border-bottom:1px solid var(--line);}
.block-items li:last-child{border-bottom:none;}
.vid{display:inline-block;margin-left:0.45rem;padding:0 0.4rem;border:1px solid var(--accent);border-radius:3px;color:var(--accent);font-size:0.68rem;line-height:1.3rem;text-decoration:none;font-family:var(--font-display);letter-spacing:0.04em;vertical-align:middle;}
.vid:active{background:var(--accent-dim);}
.link-toast{position:fixed;left:0.8rem;right:0.8rem;bottom:0.8rem;max-width:620px;margin:0 auto;background:var(--surface2);border:1px solid var(--accent);border-radius:6px;padding:0.7rem 0.9rem;font-size:0.8rem;z-index:50;}
.link-toast .lt-url{display:block;margin-top:0.35rem;word-break:break-all;color:var(--blue);user-select:all;-webkit-user-select:all;}
.link-toast button{float:right;background:none;border:none;color:var(--text-dim);font-size:1.1rem;cursor:pointer;}
.time-tag{display:inline-block;margin-left:0.5rem;font-family:var(--font-display);font-size:0.68rem;letter-spacing:0.05em;color:var(--text-dim);}
.cx-round{display:flex;align-items:center;gap:0.6rem;padding:0.35rem 0;border-bottom:1px solid var(--line);font-size:0.85rem;}
.cx-round:last-child{border-bottom:none;}
.cx-round .cx-lbl{flex:1;}
</style>
</head>
<body>
<div class="wrap">
  <div class="app-title">PLATE<span>LINE</span></div>
  <div class="app-sub">Training log + body tracking</div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="program">Program</button>
    <button class="tab-btn" data-tab="history">History</button>
    <button class="tab-btn" data-tab="body">Body</button>
  </div>

  <div id="today-panel"></div>
  <div id="program-panel" style="display:none;"></div>
  <div id="history-panel" style="display:none;"></div>
  <div id="body-panel" style="display:none;"></div>
</div>

<script>
// Storage: inside Claude, window.storage exists. On your own host/phone it does not, so fall back to localStorage.
(function(){
  if(window.storage && typeof window.storage.get === 'function') return;
  const mem = {};
  window.storage = {
    get: async function(k){
      try{ const v = localStorage.getItem(k); return v === null ? null : { key:k, value:v }; }
      catch(e){ return (k in mem) ? { key:k, value:mem[k] } : null; }
    },
    set: async function(k, v){
      try{ localStorage.setItem(k, v); }catch(e){ mem[k] = v; }
      return { key:k, value:v };
    }
  };
})();

const MOVE_CUES = {
  "Clean and Press": "Zip the bell, dip then drive, punch overhead",
  "Clean → Push Press": "Zip the bell, elbows in, dip then drive, punch overhead",
  "Halo → Squat": "Halo tight around the head, chest tall, drive through heels",
  "Goblet Squat → Press": "Bell close to chest, sit hips down, press tall overhead",
  "Burpee → High Pull": "Move fast, chest to floor, lead with elbows on the pull",
  "Rotational Swing": "Absorb and rotate the hips, generate torque from the ground",
  "Front Windmill → Low Lateral Swing": "Hinge the hips, reach long, drive laterally",
  "X Uppercut": "Rotate hips before shoulders, stay athletic and smooth",
  "Infinity Uppercuts": "Rotate through the hips, stay light and continuous",
  "Skater Bound": "Push off the outside leg, land soft, stick it",
  "Alternating Kettlebell Snatch": "Hinge and load, explode through the floor, punch through the top",
  "Reverse Lunge → Shovel": "Step back soft, rotate ribs and hips together, throw with power",
  "Burpee → Swing": "Land soft before grabbing the bell, hinge don't squat the swing",
  "Kettlebell Halo → Curtsy Lunge": "Halo slow behind the neck, curtsy at 45°, drive through the front heel",
  "Lateral Lunge to Clean": "Step wide, load the hip, clean the bell to the rack",
  "Russian Twists": "Feet up or down, rotate through the ribs, control both sides",
  "Bear Plank Kettlebell Drag": "Stay level in the plank, drag the bell without rocking the hips",
  "Dead Stop Kettlebell Swing": "Reset each rep from a dead stop, re-hinge and drive from zero",
  "Single Arm Alternating Gorilla Style Rows": "Wide stable stance, row each bell alternately, stay square",
  "Single-Leg RDL": "Hinge on one leg, reach the bell down, keep hips square",
  "Half-Kneeling Press": "Half-kneel tall, brace the core, press straight overhead",
  "Alternating Kettlebell Cleans": "Zip the bell to the rack, alternate sides smoothly",
  "Rotational Swing Transfer": "Swing and rotate, transfer the bell hand to hand at the top",
  "Hollow Hold Kettlebell Reach": "Press the low back down, reach overhead without arching",
  "Russian Kettlebell Swing": "Hip hinge, swing to chest height, snap the hips",
  "Alternating Reverse Lunge + Rotation": "Step back, rotate the torso over the front leg, drive back up",
  "Offset Goblet Squat": "Hold the bell off-center, resist the pull, squat controlled",
  "Goblet Squat": "Bell close to chest, sit hips between the heels, drive through the floor",
  "Dead Bug Pullover": "Press the low back flat, pull the bell overhead as the opposite arm and leg extend",
  "Tall Kneeling Rainbow Slam": "Tall kneeling, arc the bell overhead and slam it across the body"
};

// Offset Goblet Squat and Single-Leg RDL reuse their base cue for both sides via the (Left)/(Right) suffix strip in mv()
MOVE_CUES["Around the World"] = "Circle the bell around your head and waist, switch direction each round";
MOVE_CUES["Halo Chops"] = "Halo around the head, then chop the bell diagonally across the body";

Object.assign(MOVE_CUES, {
  "Skier Swing": "Swing across the body, pivot the back foot, alternate the bell sides smoothly",

  const cueKey = name.replace(/ \((Left|Right)\)$/, '');
  return { name, cue: MOVE_CUES[cueKey] || MOVE_CUES[name] || "" };
}

async function loadAll(){
  try{
    const t = await window.storage.get('training-data');
    if(t && t.value) trainingData = Object.assign({sessions:{},progression:{},activePhase:"phase1"}, JSON.parse(t.value));
  }catch(e){}
  try{
    const b = await window.storage.get('body-data');
    if(b && b.value) bodyData = JSON.parse(b.value);
  }catch(e){}
  renderToday();
  renderProgram();
  renderHistory();
  renderBody();
}

async function saveTraining(){
  try{ await window.storage.set('training-data', JSON.stringify(trainingData)); }catch(e){}
}
async function saveBody(){
  try{ await window.storage.set('body-data', JSON.stringify(bodyData)); }catch(e){}
}

function progKey(exId){ return trainingData.activePhase + ":" + exId; }
function chipperKey(day){ return trainingData.activePhase + ":chipper:" + day; }
function flowKey(day, moveName){ return trainingData.activePhase + ":flow:" + day + ":" + moveName; }
function getWorkingWeight(ex){
  const p = trainingData.progression[progKey(ex.id)];
  if(p) return p.weight;
  return ex.startWeight || 0;
}
function getStreak(ex){
  const p = trainingData.progression[progKey(ex.id)];
  return p ? (p.streak||0) : 0;
}
function lastSessionFor(exId, beforeDate){
  const dates = Object.keys(trainingData.sessions).filter(d => d < (beforeDate||"9999")).sort().reverse();
  for(const d of dates){
    const s = trainingData.sessions[d];
    if(s.entries && s.entries[exId]) return {date:d, entry:s.entries[exId]};
  }
  return null;
}
function fmtTime(totalSec){
  const m = Math.floor(totalSec/60), s = totalSec%60;
  return m+":"+(s<10?'0':'')+s;
}
function plateSVG(weight){
  const perSide = Math.max(0,(weight-45)/2);
  const denoms = [45,25,10,5,2.5];
  let remaining = perSide, plates=[];
  for(const d of denoms){
    while(remaining >= d - 0.01){ plates.push(d); remaining -= d; }
  }
  const heights = {45:34,25:28,10:22,5:16,2.5:12};
  const widths = {45:8,25:8,10:6,5:5,2.5:4};
  let html = '<div class="plate-bar"><div class="bar-line"></div>';
  plates.forEach(p=>{
    html += '<div class="plate" style="height:'+heights[p]+'px;width:'+widths[p]+'px;" title="'+p+'lb"></div>';
  });
  html += '<div class="bar-line" style="flex:0.3"></div></div>';
  return weight > 45 ? html : '';
}

function stopFlowTimer(){
  if(flowTimerId){ clearInterval(flowTimerId); flowTimerId = null; }
}

// ---------- VIDEO LINKS ----------
// Every exercise gets a play button that opens a YouTube search for it.
// To pin an exact video, add the cleaned name here: VIDEO_LINKS["Halo Chops"] = "https://youtu.be/XXXXXXXX";
const VIDEO_LINKS = {};
const NO_KB_HINT = ["Bear Crawl","Cossack Squat","Skater Bound"];
function cleanName(name){
  return name.replace(/ \((Left|Right)\)$/,'').replace(/\s*\(.*?\)/g,'').replace(/\s+\d.*$/,'').trim();
}
function videoLink(name, kb){
  const clean = cleanName(name);
  if(!clean || /^\d+\s/.test(clean)) return '';
  let url = VIDEO_LINKS[clean];
  if(!url){
    const hint = (kb && !/kettlebell/i.test(clean) && !NO_KB_HINT.includes(clean)) ? ' kettlebell' : '';
    url = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(clean + hint + ' how to');
  }
  return '<a class="vid" href="'+url+'" target="_blank" rel="noopener">&#9654; video</a>';
}

// Some viewers (sandboxed previews) block new tabs. Try to open; if blocked, copy the link and show it.
document.addEventListener('click', function(e){
  const a = e.target.closest && e.target.closest('a.vid');
  if(!a) return;
  e.preventDefault();
  e.stopPropagation();
  const url = a.href;
  let opened = null;
  try{ opened = window.open(url, '_blank', 'noopener'); }catch(err){}
  if(opened) return;
  const old = document.querySelector('.link-toast');
  if(old) old.remove();
  const t = document.createElement('div');
  t.className = 'link-toast';
  t.innerHTML = '<button aria-label="Close">&times;</button><span class="lt-msg">This viewer blocks links. Press and hold the link below to copy it, then paste it into your browser.</span><span class="lt-url"></span>';
  t.querySelector('.lt-url').textContent = url;
  t.querySelector('button').addEventListener('click', ()=> t.remove());
  document.body.appendChild(t);
  try{
    navigator.clipboard.writeText(url).then(function(){
      const m = t.querySelector('.lt-msg');
      if(m) m.textContent = 'This viewer blocks links. Link copied. Paste it into your browser.';
    }, function(){});
  }catch(err){}
  setTimeout(()=>{ if(t.parentNode) t.remove(); }, 20000);
}, true);

function blocksHtml(blocks){
  if(!blocks || !blocks.length) return '';
  return blocks.map(b=>'<div class="block-card"><div class="block-head"><span>'+b.title+'</span><span class="bm">'+b.minutes+' min</span></div>'
    + '<ul class="block-items">'+b.items.map(i=>'<li>'+i+videoLink(i, false)+'</li>').join('')+'</ul></div>').join('');
}
function mainMinutes(phase, day){
  if(day.type==='flow') return Math.round(phase.rounds*day.movements.length*(phase.workSeconds+phase.restSeconds)/60);
  if(day.type==='chipper') return day.chipper.targetMinutes;
  if(day.type==='complex') return day.complex.mainMinutes;
  return day.mainMinutes || 0;
}
function dayMinutes(phase, day){
  const sum = arr => (arr||[]).reduce((a,b)=>a+b.minutes,0);
  return sum(day.before) + mainMinutes(phase, day) + sum(day.after) + (day.cardio && day.cardio.minutes ? day.cardio.minutes : 0);
}
function timeTag(phase, day){
  return day.before ? '<span class="time-tag">~'+dayMinutes(phase, day)+' min total</span>' : '';
}

function renderToday(){
  stopFlowTimer();
  flowState = null;
  const phase = activePhase();
  const day = phase.days[currentDay];
  const el = document.getElementById('today-panel');
  let html = '<div class="phase-tag">'+phase.name+' &middot; '+phase.weeks+'</div>';
  html += '<div class="day-row">';
  DAY_ORDER.forEach(d=>{
    const isTest = phase.days[d].testDay;
    html += '<button class="day-pill '+(d===currentDay?'active':'')+(isTest?' test-day':'')+'" data-day="'+d+'">'+d+'</button>';
  });
  html += '</div>';
  html += '<div class="session-head"><div class="kind">'+day.type+(day.testDay?' &middot; test day':'')+timeTag(phase, day)+'</div><h2>'+DAY_FULL[currentDay]+' &mdash; '+day.kind+'</h2></div>';

  if(day.type === "complex"){
    renderComplexDay(phase, day, el, html);
    return;
  }
  if(day.type === "flow"){
    renderFlowDay(phase, day, el, html);
    return;
  }
  if(day.type === "chipper"){
    renderChipperDay(day, el, html);
    return;
  }

  html += blocksHtml(day.before);
  if(day.cardio){
    html += '<div class="cardio-card"><div class="cardio-left"><div class="cardio-type">'+day.cardio.type+' cardio</div><div class="cardio-desc">'+day.cardio.desc+'</div></div><button class="cardio-check" id="cardio-check" data-checked="0">&#10003;</button></div>';
  }

  day.exercises.forEach(ex=>{
    const isBodyweight = ex.bodyweight;
    const working = isBodyweight ? null : getWorkingWeight(ex);
    const streak = getStreak(ex);
    const prev = lastSessionFor(ex.id, todayDateKey);
    const unit = ex.unit || "reps";
    const repLabel = ex.repMin===ex.repMax ? (ex.repMin+' '+unit) : (ex.repMin+'-'+ex.repMax+' '+unit);
    const statusClass = streak>=1 ? 'status-pace' : 'status-build';
    const statusText = streak>=1 ? 'On pace' : 'Building';

    html += '<div class="ex-card" data-ex="'+ex.id+'">'
      + '<div class="ex-top"><div><div class="ex-name">'+ex.name+videoLink(ex.name, false)+'</div>'
      + '<div class="ex-target">'+ex.sets+' x '+repLabel+'</div></div>'
      + '<div class="ex-status '+statusClass+'">'+statusText+'</div></div>';

    if(!isBodyweight){
      const bumped = streak>=2;
      html += '<div class="weight-row"><span class="weight-val">'+working+'</span><span class="weight-unit">lb</span>'
        + (bumped ? '<span class="weight-bump">&uarr; ready to add weight</span>' : '') + '</div>';
      html += plateSVG(working);
    }

    html += '<div class="sets-grid">';
    for(let i=0;i<ex.sets;i++){
      html += '<div class="set-line" data-set="'+i+'"><span class="set-idx">'+(i+1)+'</span>'
        + (!isBodyweight ? '<input type="number" class="set-weight" placeholder="'+(working||0)+'" value="">' : '')
        + '<input type="number" class="set-reps" placeholder="reps">'
        + '<span class="set-lbl">'+(unit==='sec'?'sec': unit==='yards'?'yd':'')+'</span>'
        + '<button class="set-check" data-checked="0">&#10003;</button></div>';
    }
    html += '</div>';

    if(prev){
      html += '<div class="prev-line">Last time ('+prev.date+'): '+prev.entry.sets.map(function(s){return (s.weight?s.weight+'x':'')+s.reps;}).join(', ')+'</div>';
    }
    html += '</div>';
  });

  html += blocksHtml(day.after);
  html += '<button class="save-btn" id="save-session">Save session</button>';
  el.innerHTML = html;

  el.querySelectorAll('.day-pill').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentDay = btn.dataset.day; renderToday(); });
  });
  el.querySelectorAll('.set-check').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const checked = btn.dataset.checked === "1";
      btn.dataset.checked = checked ? "0":"1";
      btn.classList.toggle('done', !checked);
    });
  });
  const cardioBtn = document.getElementById('cardio-check');
  if(cardioBtn){
    cardioBtn.addEventListener('click', ()=>{
      const checked = cardioBtn.dataset.checked === "1";
      cardioBtn.dataset.checked = checked ? "0":"1";
      cardioBtn.classList.toggle('done', !checked);
    });
  }
  document.getElementById('save-session').addEventListener('click', saveSession);
}

// ---------- FLOW (interval combo) DAYS ----------

function buildFlowSequence(phase, day){
  const seq = [];
  for(let r=0;r<phase.rounds;r++){
    day.movements.forEach((m,i)=>{
      seq.push({ moveIndex:i, name:m.name, cue:m.cue, round:r+1 });
    });
  }
  return seq;
}

function renderFlowDay(phase, day, el, headHtml){
  let html = headHtml;
  html += blocksHtml(day.before);
  html += '<div class="flow-summary">'
    + '<div class="flow-meta">'+phase.rounds+' rounds &middot; '+phase.workSeconds+'s work / '+phase.restSeconds+'s transition &middot; chase reps each round</div>'
    + '<div class="flow-move-list">'
    + day.movements.map(m=>{
        const best = trainingData.progression[flowKey(currentDay, m.name)];
        return '<div class="flow-move-row"><span>'+m.name+videoLink(m.name, true)+'</span><span class="fm-best">'+(best?'best '+best.bestReps:'&mdash;')+'</span></div>';
      }).join('')
    + '</div>'
    + '<button class="save-btn" id="start-flow">Start session</button>'
    + '</div>';
  html += '<div id="flow-stage-area"></div>';
  html += blocksHtml(day.after);
  el.innerHTML = html;

  el.querySelectorAll('.day-pill').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentDay = btn.dataset.day; renderToday(); });
  });
  document.getElementById('start-flow').addEventListener('click', ()=> startFlow(phase, day));
}

function startFlow(phase, day){
  const sequence = buildFlowSequence(phase, day);
  flowState = {
    phase, day, sequence, stepIndex:0, stage:'work',
    secondsLeft: phase.workSeconds, reps: sequence.map(()=>0)
  };
  document.getElementById('start-flow').style.display = 'none';
  renderFlowStage();
  flowTimerId = setInterval(tickFlow, 1000);
}

function tickFlow(){
  if(!flowState) return;
  flowState.secondsLeft--;
  if(flowState.secondsLeft <= 0){
    if(flowState.stage === 'work'){
      if(navigator.vibrate) navigator.vibrate(200);
      if(flowState.stepIndex >= flowState.sequence.length - 1){
        finishFlow();
        return;
      }
      flowState.stage = 'rest';
      flowState.secondsLeft = flowState.phase.restSeconds;
    } else {
      if(navigator.vibrate) navigator.vibrate(100);
      flowState.stepIndex++;
      flowState.stage = 'work';
      flowState.secondsLeft = flowState.phase.workSeconds;
    }
  }
  renderFlowStage();
}

function renderFlowStage(){
  const area = document.getElementById('flow-stage-area');
  if(!area || !flowState) return;
  const step = flowState.sequence[flowState.stepIndex];
  const isWork = flowState.stage === 'work';
  let html = '<div class="flow-stage '+(isWork?'work':'rest')+'">'
    + '<div class="flow-progress">Round '+step.round+' of '+flowState.phase.rounds+' &middot; Move '+(step.moveIndex+1)+' of '+flowState.day.movements.length+'</div>'
    + '<div class="flow-move-name">'+step.name+'</div>'
    + '<div style="margin-bottom:0.5rem;">'+videoLink(step.name, true)+'</div>';
  if(isWork){
    html += '<div class="flow-cue">'+step.cue+'</div>'
      + '<div class="flow-timer">'+flowState.secondsLeft+'</div>'
      + '<div class="flow-rep-controls">'
      + '<button class="flow-rep-btn" id="flow-rep-minus">&minus;</button>'
      + '<div class="flow-rep-count" id="flow-rep-count">'+flowState.reps[flowState.stepIndex]+'</div>'
      + '<button class="flow-rep-btn" id="flow-rep-plus">+</button>'
      + '</div>';
  } else {
    html += '<div class="flow-timer">'+flowState.secondsLeft+'</div>'
      + '<div class="flow-rest-label">Transition &mdash; next up</div>';
  }
  html += '</div>';
  area.innerHTML = html;

  if(isWork){
    document.getElementById('flow-rep-plus').addEventListener('click', ()=>{
      flowState.reps[flowState.stepIndex]++;
      document.getElementById('flow-rep-count').textContent = flowState.reps[flowState.stepIndex];
    });
    document.getElementById('flow-rep-minus').addEventListener('click', ()=>{
      flowState.reps[flowState.stepIndex] = Math.max(0, flowState.reps[flowState.stepIndex]-1);
      document.getElementById('flow-rep-count').textContent = flowState.reps[flowState.stepIndex];
    });
  }
}

async function finishFlow(){
  stopFlowTimer();
  const { phase, day, sequence, reps } = flowState;
  const bestByMove = {};
  const prTags = {};
  day.movements.forEach(m=>{ bestByMove[m.name] = 0; });
  sequence.forEach((step, i)=>{
    if(reps[i] > bestByMove[step.name]) bestByMove[step.name] = reps[i];
  });
  Object.keys(bestByMove).forEach(name=>{
    const key = flowKey(currentDay, name);
    const prog = trainingData.progression[key] || {};
    const isPR = (prog.bestReps===undefined || bestByMove[name] > prog.bestReps);
    if(isPR){ prog.bestReps = bestByMove[name]; prTags[name] = true; }
    trainingData.progression[key] = prog;
  });

  trainingData.sessions[todayDateKey] = {
    day: currentDay, kind: day.kind, phase: phase.id, phaseName: phase.name,
    flowResult: { rounds: phase.rounds, workSeconds: phase.workSeconds, restSeconds: phase.restSeconds,
      byMove: bestByMove, prTags }
  };
  await saveTraining();

  const area = document.getElementById('flow-stage-area');
  let html = '<div class="flow-stage work"><div class="flow-move-name">Session complete</div><div class="flow-done-summary">';
  Object.keys(bestByMove).forEach(name=>{
    html += '<div class="flow-move-row" style="text-align:left;"><span>'+name+'</span><span>best round: '+bestByMove[name]+(prTags[name]?'<span class="flow-pr-tag">PR</span>':'')+'</span></div>';
  });
  html += '</div></div>';
  area.innerHTML = html;
  flowState = null;
  renderHistory();
}

async function saveComplexSession(){
  const phase = activePhase();
  const day = phase.days[currentDay];
  const cx = day.complex;
  const done = document.querySelectorAll('#today-panel .cx-round .set-check.done').length;
  if(done===0){
    alert("Check off at least one completed round before saving.");
    return;
  }
  const key = complexKey(currentDay);
  const prog = trainingData.progression[key] || { weight: cx.startWeight, streak:0 };
  const usedInput = parseFloat(document.getElementById('cx-weight').value);
  const used = isNaN(usedInput) ? (prog.weight || cx.startWeight) : usedInput;
  if(done >= cx.rounds){
    prog.streak = (prog.streak||0)+1;
    if(prog.streak>=2){ prog.weight = used + cx.inc; prog.streak = 0; }
    else { prog.weight = used; }
  } else {
    prog.streak = 0;
    prog.weight = used;
  }
  prog.lastRounds = done;
  prog.lastWeight = used;
  trainingData.progression[key] = prog;

  trainingData.sessions[todayDateKey] = {
    day: currentDay, kind: day.kind, phase: phase.id, phaseName: phase.name,
    complexResult: { label: cx.label, rounds: done, totalRounds: cx.rounds, weight: used }
  };
  await saveTraining();
  renderToday();
  renderHistory();
}

// ---------- STRENGTH (Wednesday) ----------

async function saveSession(){
  const phase = activePhase();
  const day = phase.days[currentDay];
  const cards = document.querySelectorAll('#today-panel .ex-card');
  const entries = {};
  cards.forEach(card=>{
    const exId = card.dataset.ex;
    const ex = day.exercises.find(e=>e.id===exId);
    const setLines = card.querySelectorAll('.set-line');
    const sets = [];
    setLines.forEach(line=>{
      const checked = line.querySelector('.set-check').dataset.checked === "1";
      if(!checked) return;
      const wEl = line.querySelector('.set-weight');
      const rEl = line.querySelector('.set-reps');
      const weight = wEl ? (parseFloat(wEl.value)||getWorkingWeight(ex)) : null;
      const reps = parseFloat(rEl.value);
      if(!isNaN(reps)) sets.push({weight, reps});
    });
    if(sets.length>0){
      entries[exId] = { sets };
      if(!ex.bodyweight){
        const allHitTop = sets.length>=ex.sets && sets.every(s=>s.reps >= ex.repMax);
        const key = progKey(exId);
        const p = trainingData.progression[key] || { weight: ex.startWeight, streak:0 };
        if(allHitTop){
          p.streak = (p.streak||0)+1;
          if(p.streak>=2){
            p.weight = (p.weight||ex.startWeight) + (ex.inc||5);
            p.streak = 0;
          }
        } else {
          p.streak = 0;
        }
        if(!trainingData.progression[key]) p.weight = ex.startWeight;
        trainingData.progression[key] = p;
      }
    }
  });
  const cardioEl = document.getElementById('cardio-check');
  const cardioChecked = !!cardioEl && cardioEl.dataset.checked === "1";
  if(Object.keys(entries).length===0 && !cardioChecked){
    alert("Check off at least one completed set or the cardio block before saving.");
    return;
  }
  trainingData.sessions[todayDateKey] = { day: currentDay, kind: day.kind, phase: phase.id, phaseName: phase.name, entries, cardio: cardioChecked };
  await saveTraining();
  renderToday();
  renderHistory();
}

function renderProgram(){
  const el = document.getElementById('program-panel');
  let html = '';
  PHASES.forEach(phase=>{
    const isActive = phase.id === trainingData.activePhase;
    html += '<div class="phase-card '+(isActive?'active':'')+'">'
      + '<div class="phase-top"><div><div class="phase-name">'+phase.name+'</div><div class="phase-weeks">'+phase.weeks+'</div></div>'
      + (isActive ? '<div class="phase-badge">Active</div>' : '') + '</div>'
      + '<div class="phase-focus">'+phase.focus+'</div>'
      + '<div class="phase-days">';
    DAY_ORDER.forEach(d=>{
      const day = phase.days[d];
      let rightLabel, names;
      if(day.type === "flow"){
        rightLabel = phase.rounds+' rounds &middot; '+phase.workSeconds+'s/'+phase.restSeconds+'s';
        names = day.movements.map(m=>m.name).join(', ');
      } else if(day.type === "complex"){
        rightLabel = day.complex.rounds+' rounds &middot; '+day.complex.label;
        names = day.complex.movements.map(m=>m.name+' x'+m.reps).join(', ');
      } else if(day.type === "chipper"){
        const rounds = day.chipper.rounds||1;
        rightLabel = (rounds>1 ? rounds+' rounds under '+day.chipper.targetMinutes+' min' : 'under '+day.chipper.targetMinutes+' min');
        names = day.chipper.movements.map(m=>m.name+' x'+m.reps+(m.unit?' '+m.unit:'')).join(', ');
      } else {
        rightLabel = day.cardio ? day.cardio.type : 'Strength';
        names = day.exercises.map(e=>e.name).join(', ');
      }
      const mins = day.before ? ' &middot; ~'+dayMinutes(phase, day)+' min' : '';
      html += '<div class="phase-day-detail"><div class="pd-head"><span>'+d+' &middot; '+day.kind+'</span><span>'+rightLabel+mins+'</span></div><div class="pd-exlist">'+names+'</div></div>';
    });
    html += '</div>';
    if(!isActive){
      html += '<button class="ghost-btn" data-activate="'+phase.id+'">Make active</button>';
    }
    html += '</div>';
  });
  el.innerHTML = html;
  el.querySelectorAll('[data-activate]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      trainingData.activePhase = btn.dataset.activate;
      await saveTraining();
      renderProgram();
      renderToday();
    });
  });
}

function renderHistory(){
  const el = document.getElementById('history-panel');
  const dates = Object.keys(trainingData.sessions).sort().reverse();
  if(dates.length===0){
    el.innerHTML = '<div class="empty-note">No sessions logged yet.</div>';
    return;
  }
  let html = '';
  dates.forEach(d=>{
    const s = trainingData.sessions[d];
    if(s.flowResult){
      const fr = s.flowResult;
      const moveCount = Object.keys(fr.byMove).length;
      const prCount = Object.keys(fr.prTags||{}).length;
      html += '<div class="hist-item" data-date="'+d+'"><div class="hist-head">'
        + '<div><div class="hist-date">'+d+'</div><div class="hist-day">'+(DAY_FULL[s.day]||s.day)+' &mdash; '+s.kind+(s.phaseName?' &middot; '+s.phaseName:'')+'</div></div>'
        + '<div class="hist-day">'+fr.rounds+' rounds'+(prCount?' &middot; '+prCount+' PR':'')+'</div></div>'
        + '<div class="hist-detail" id="detail-'+d+'">'
        + Object.entries(fr.byMove).map(([name,best])=>'<div class="hd-line"><span>'+name+'</span><span>'+best+' reps'+(fr.prTags&&fr.prTags[name]?' (PR)':'')+'</span></div>').join('')
        + '</div></div>';
      return;
    }
    if(s.complexResult){
      const xr = s.complexResult;
      html += '<div class="hist-item" data-date="'+d+'"><div class="hist-head">'
        + '<div><div class="hist-date">'+d+'</div><div class="hist-day">'+(DAY_FULL[s.day]||s.day)+' &mdash; '+s.kind+(s.phaseName?' &middot; '+s.phaseName:'')+'</div></div>'
        + '<div class="hist-day">'+xr.rounds+'/'+xr.totalRounds+' rounds @ '+xr.weight+' lb</div></div>'
        + '<div class="hist-detail" id="detail-'+d+'"><div class="hd-line"><span>'+xr.label+'</span><span>'+xr.weight+' lb</span></div></div></div>';
      return;
    }
    if(s.chipperResult){
      const cr = s.chipperResult;
      html += '<div class="hist-item" data-date="'+d+'"><div class="hist-head">'
        + '<div><div class="hist-date">'+d+'</div><div class="hist-day">'+(DAY_FULL[s.day]||s.day)+' &mdash; '+s.kind+(s.phaseName?' &middot; '+s.phaseName:'')+'</div></div>'
        + '<div class="hist-day">'+fmtTime(cr.seconds)+(cr.isPR?' (PR)':'')+'</div></div>'
        + '<div class="hist-detail" id="detail-'+d+'"><div class="hd-line"><span>'+cr.label+'</span><span>KB '+cr.kbWeight+'lb</span></div></div></div>';
      return;
    }
    const exNames = Object.keys(s.entries||{}).length;
    html += '<div class="hist-item" data-date="'+d+'"><div class="hist-head">'
      + '<div><div class="hist-date">'+d+'</div><div class="hist-day">'+(DAY_FULL[s.day]||s.day)+' &mdash; '+s.kind+(s.phaseName?' &middot; '+s.phaseName:'')+'</div></div>'
      + '<div class="hist-day">'+exNames+' lifts'+(s.cardio?' + cardio':'')+'</div></div>'
      + '<div class="hist-detail" id="detail-'+d+'">';
    const phaseForSession = PHASES.find(p=>p.id===s.phase) || activePhase();
    const dayProg = phaseForSession.days[s.day];
    Object.entries(s.entries||{}).forEach(([exId, entry])=>{
      const ex = dayProg && dayProg.exercises ? dayProg.exercises.find(e=>e.id===exId) : null;
      const name = ex ? ex.name : exId;
      const setsStr = entry.sets.map(function(st){return (st.weight?st.weight+'x':'')+st.reps;}).join(', ');
      html += '<div class="hd-line"><span>'+name+'</span><span>'+setsStr+'</span></div>';
    });
    html += '</div></div>';
  });
  el.innerHTML = html;
  el.querySelectorAll('.hist-item').forEach(item=>{
    item.addEventListener('click', ()=>{
      const d = item.dataset.date;
      document.getElementById('detail-'+d).classList.toggle('open');
    });
  });
}

function renderBody(){
  const el = document.getElementById('body-panel');
  const entries = [...bodyData.entries].sort((a,b)=> a.date < b.date ? 1 : -1);
  const latest = entries[0];
  const prior = entries[1];
  const weightDelta = (latest && prior) ? (latest.weight - prior.weight) : null;

  let html = '<div class="body-form">'
    + '<div class="form-row"><label>Date</label><input type="date" id="bf-date" value="'+todayDateKey+'"></div>'
    + '<div class="photo-row"><label class="photo-label" for="food-photo">Snap or upload a food photo to estimate macros</label>'
    + '<input type="file" accept="image/*" capture="environment" id="food-photo" style="display:none;">'
    + '<button type="button" class="ghost-btn" id="set-api-key" style="width:auto;margin-top:0;padding:0.5rem 0.7rem;">API key</button></div>'
    + '<div class="photo-status" id="photo-status"></div>'
    + '<div id="food-items"></div>'
    + '<div class="form-row"><label>Body weight (lb)</label><input type="number" id="bf-weight" placeholder="264"></div>'
    + '<div class="form-grid">'
    + '<div class="form-row"><label>Protein (g)</label><input type="number" id="bf-protein" placeholder="220"></div>'
    + '<div class="form-row"><label>Fat (g)</label><input type="number" id="bf-fat" placeholder="140"></div>'
    + '<div class="form-row"><label>Carbs (g)</label><input type="number" id="bf-carbs" placeholder="30"></div>'
    + '</div><button class="save-btn" id="save-body">Log entry</button></div>';

  html += '<div class="metric-strip">';
  html += '<div class="metric-card"><div class="metric-lbl">Current</div><div class="metric-val">'+(latest?latest.weight+' lb':'&mdash;')+'</div>'
    + (weightDelta!==null?'<div class="metric-delta '+(weightDelta<=0?'delta-down':'delta-up')+'">'+(weightDelta>0?'+':'')+weightDelta+' since last</div>':'')+'</div>';
  const last7 = entries.slice(0,7).filter(e=>e.protein);
  const avgProtein = last7.length ? Math.round(last7.reduce((a,e)=>a+(e.protein||0),0)/last7.length) : null;
  html += '<div class="metric-card"><div class="metric-lbl">Avg protein (7d)</div><div class="metric-val">'+(avgProtein?avgProtein+'g':'&mdash;')+'</div></div>';
  html += '<div class="metric-card"><div class="metric-lbl">Entries logged</div><div class="metric-val">'+entries.length+'</div></div>';
  html += '</div>';

  if(entries.length>=2){
    html += '<div class="chart-wrap"><div class="chart-title">Weight trend</div>' + weightSparkline(entries) + '</div>';
  }

  html += '<div class="chart-wrap"><div class="chart-title">Log</div>';
  if(entries.length===0){
    html += '<div class="empty-note">No entries yet.</div>';
  } else {
    entries.forEach(e=>{
      const itemsNote = (e.items && e.items.length) ? ' ('+e.items.map(function(it){return it.description;}).join(', ')+')' : '';
      html += '<div class="body-log-row"><span class="blr-date">'+e.date+itemsNote+'</span><span>'+e.weight+'lb &middot; P'+(e.protein||0)+' F'+(e.fat||0)+' C'+(e.carbs||0)+'</span></div>';
    });
  }
  html += '</div>';

  el.innerHTML = html;
  document.getElementById('save-body').addEventListener('click', saveBodyEntry);
  document.getElementById('food-photo').addEventListener('change', handlePhotoUpload);
  document.getElementById('set-api-key').addEventListener('click', function(){
    let cur = '';
    try{ cur = localStorage.getItem('plateline-api-key') || ''; }catch(e){}
    const k = window.prompt('Paste your Anthropic API key for photo macros. It is stored only on this device. Leave blank to remove it.', cur);
    if(k === null) return;
    try{
      if(k.trim()) localStorage.setItem('plateline-api-key', k.trim());
      else localStorage.removeItem('plateline-api-key');
    }catch(e){}
  });
  document.getElementById('bf-date').addEventListener('change', renderFoodItems);
  renderFoodItems();
}

function currentFoodDate(){
  const dEl = document.getElementById('bf-date');
  return dEl ? dEl.value : todayDateKey;
}

function renderFoodItems(){
  const wrap = document.getElementById('food-items');
  if(!wrap) return;
  const date = currentFoodDate();
  const items = pendingFoodItems[date] || [];
  wrap.innerHTML = items.map((it,i)=>
    '<div class="food-item"><span class="fi-desc">'+it.description+'</span>'
    + '<span class="fi-macros">P'+it.protein_g+' F'+it.fat_g+' C'+it.carbs_g+'</span>'
    + '<button class="fi-remove" data-idx="'+i+'">&times;</button></div>'
  ).join('');
  wrap.querySelectorAll('.fi-remove').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.idx);
      const removed = pendingFoodItems[date].splice(idx,1)[0];
      applyMacroDelta(-removed.protein_g, -removed.fat_g, -removed.carbs_g);
      renderFoodItems();
    });
  });
}

function applyMacroDelta(p,f,c){
  const pEl = document.getElementById('bf-protein');
  const fEl = document.getElementById('bf-fat');
  const cEl = document.getElementById('bf-carbs');
  pEl.value = Math.max(0, Math.round((parseFloat(pEl.value)||0) + p));
  fEl.value = Math.max(0, Math.round((parseFloat(fEl.value)||0) + f));
  cEl.value = Math.max(0, Math.round((parseFloat(cEl.value)||0) + c));
}

async function handlePhotoUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('photo-status');
  statusEl.className = 'photo-status';
  statusEl.textContent = 'Analyzing photo...';
  try{
    const base64Data = await new Promise((res, rej)=>{
      const r = new FileReader();
      r.onload = () => res(r.result.split(',')[1]);
      r.onerror = () => rej(new Error('Read failed'));
      r.readAsDataURL(file);
    });
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: (function(){
        const h = { 'Content-Type': 'application/json' };
        let key = null;
        try{ key = localStorage.getItem('plateline-api-key'); }catch(e){}
        if(key){ h['x-api-key'] = key; h['anthropic-version'] = '2023-06-01'; h['anthropic-dangerous-direct-browser-access'] = 'true'; }
        return h;
      })(),
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: file.type || 'image/jpeg', data: base64Data } },
            { type: 'text', text: 'Identify the food in this photo and estimate the macros for the portion shown. Respond with ONLY a JSON object and nothing else, no markdown fences, no preamble: {"description": "short food name", "protein_g": number, "fat_g": number, "carbs_g": number}. Give your best estimate even if you are not fully certain.' }
          ]
        }]
      })
    });
    const data = await response.json();
    if(!response.ok){
      throw new Error((data && data.error && data.error.message) || ('HTTP '+response.status));
    }
    const textBlock = (data.content || []).find(b => b.type === 'text');
    if(!textBlock) throw new Error('No response');
    const clean = textBlock.text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    parsed.protein_g = Math.round(parsed.protein_g) || 0;
    parsed.fat_g = Math.round(parsed.fat_g) || 0;
    parsed.carbs_g = Math.round(parsed.carbs_g) || 0;

    const date = currentFoodDate();
    if(!pendingFoodItems[date]) pendingFoodItems[date] = [];
    pendingFoodItems[date].push(parsed);
    applyMacroDelta(parsed.protein_g, parsed.fat_g, parsed.carbs_g);
    renderFoodItems();
    statusEl.textContent = 'Added: ' + parsed.description;
  }catch(err){
    statusEl.className = 'photo-status error';
    let hasKey = false;
    try{ hasKey = !!localStorage.getItem('plateline-api-key'); }catch(e){}
    statusEl.textContent = hasKey
      ? "Couldn't read that photo. Try again or enter macros manually."
      : "Photo macros need your Anthropic API key outside Claude. Tap 'API key' to add it, or enter macros manually.";
  }
  e.target.value = '';
}

function weightSparkline(entriesDesc){
  const entries = [...entriesDesc].reverse().slice(-30);
  const weights = entries.map(e=>e.weight);
  const min = Math.min(...weights), max = Math.max(...weights);
  const range = (max-min)||1;
  const w = 600, h = 100, pad = 8;
  const pts = entries.map((e,i)=>{
    const x = pad + (i/(entries.length-1||1))*(w-2*pad);
    const y = h - pad - ((e.weight-min)/range)*(h-2*pad);
    return x+','+y;
  }).join(' ');
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:80px;"><polyline points="'+pts+'" fill="none" stroke="#C4432B" stroke-width="2"/></svg>';
}

async function saveBodyEntry(){
  const date = document.getElementById('bf-date').value || todayDateKey;
  const weight = parseFloat(document.getElementById('bf-weight').value);
  if(isNaN(weight)){
    alert("Enter a body weight first.");
    return;
  }
  const protein = parseFloat(document.getElementById('bf-protein').value)||0;
  const fat = parseFloat(document.getElementById('bf-fat').value)||0;
  const carbs = parseFloat(document.getElementById('bf-carbs').value)||0;
  const items = pendingFoodItems[date] || [];
  bodyData.entries = bodyData.entries.filter(e=>e.date!==date);
  bodyData.entries.push({date, weight, protein, fat, carbs, items});
  delete pendingFoodItems[date];
  await saveBody();
  renderBody();
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    stopFlowTimer();
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    ['today','program','history','body'].forEach(t=>{
      document.getElementById(t+'-panel').style.display = (t===btn.dataset.tab) ? 'block':'none';
    });
  });
});

loadAll();
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
